<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- The editor is never indexed. public/_headers sends the same rule -->
    <meta name="robots" content="noindex, nofollow" />
    <title>FEDERG CMS (practice project)</title>
  </head>
  <body>
    <!--
      Sveltia CMS, pinned to an exact version so an update never changes the editor by surprise.
      To upgrade, change the version number, test /admin/ locally and commit.
      No type="module" and no stylesheet: the bundle is a classic script with its own styles.
    -->
    <script src="https://unpkg.com/@sveltia/cms@0.253.2/dist/sveltia-cms.js"></script>
  </body>
</html>
