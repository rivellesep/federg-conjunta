# Email sign-in for the CMS: Cloudflare Access + GitHub App, editors need no GitHub account.
# See src/index.js for how it works and INVESTIGACION-SIN-GITHUB.md for why.
#
# Deploy from the project root:  npm run cms-email:deploy
# URL: https://federg-cms-email.enric-albert-federg.workers.dev/admin/
name = "federg-cms-email"
main = "src/index.js"
compatibility_date = "2026-10-01"
workers_dev = true
# No per-version preview URLs: they would be extra hostnames to protect with Access
preview_urls = false
# Keep the variables set in the dashboard (ACCESS_*, GITHUB_APP_ID...) when deploying
keep_vars = true

[assets]
# Generated by build-config.mjs from public/admin/ before each deploy
directory = "./public"
binding = "ASSETS"
# /auth and /api/github/* are not files, so they always reach the Worker
not_found_handling = "none"

# None of these are secrets: they identify the repository, the Access application and the
# GitHub App, but give no access on their own
[vars]
REPO_OWNER = "rivellesep"
REPO_NAME = "federg-conjunta"
ACCESS_TEAM_DOMAIN = "federg-practicas.cloudflareaccess.com"
# Audience tag of the Access application created with "Enable access" on the workers.dev URL
ACCESS_AUD = "7d6f47ee7740fc65f286cec822483fd52a1229e0b61cbf82836f84c15db4be79"
GITHUB_APP_ID = "5625343"
GITHUB_INSTALLATION_ID = "178870108"

# Secrets, set with `npx wrangler secret put NAME --config cms-email/wrangler.toml`:
#   GITHUB_APP_PRIVATE_KEY  contents of the GitHub App's .pem file
#   EDITOR_ALIASES          optional {"email":"Name", ...} for commit messages
